sensitive:
  enabled: true
  fail-safe: true

  # Built-in keyword to rule type mappings
  keywords:
    # Phone
    phone: PHONE_MASK
    phoneno: PHONE_MASK
    phone_no: PHONE_MASK
    phonenum: PHONE_MASK
    phone_num: PHONE_MASK
    mobile: PHONE_MASK
    mobileno: PHONE_MASK
    mobile_no: PHONE_MASK
    usermobile: PHONE_MASK
    mobilephone: PHONE_MASK
    tel: PHONE_MASK
    telephone: PHONE_MASK

    # Name
    name: NAME_MASK
    username: NAME_MASK
    realname: NAME_MASK
    real_name: NAME_MASK
    nickname: NAME_MASK
    nick_name: NAME_MASK
    customername: NAME_MASK
    customer_name: NAME_MASK

    # ID Card
    idcard: IDCARD_MASK
    idcardno: IDCARD_MASK
    id_card: IDCARD_MASK
    id_number: IDCARD_MASK
    idno: IDCARD_MASK
    identitycard: IDCARD_MASK
    identity_card: IDCARD_MASK
    identityno: IDCARD_MASK
    certificateno: IDCARD_MASK

    # Account / Bank card
    accountno: ACCOUNT_MASK
    account_number: ACCOUNT_MASK
    bankcardno: ACCOUNT_MASK
    bank_card_no: ACCOUNT_MASK
    cardno: ACCOUNT_MASK
    cardnumber: ACCOUNT_MASK
    card_number: ACCOUNT_MASK

    # Email
    email: EMAIL_MASK
    mail: EMAIL_MASK

    # Address
    address: ADDRESS_MASK
    addr: ADDRESS_MASK

    # Credentials
    password: FULL_MASK
    passwd: FULL_MASK
    pwd: FULL_MASK
    secret: FULL_MASK
    token: FULL_MASK
    accesstoken: FULL_MASK
    access_token: FULL_MASK

  rules: []

  excludes: []

  # 文本模式扫描：识别裸露的手机号/身份证/银行卡号数字序列。
  # enabled: 全局开关，true 时对所有日志（mask）启用文本模式扫描
  # sql:     SQL 参数日志独立开关，默认 true（向后兼容）
  textPattern:
    enabled: false
    sql: true
    patterns:
      - phone
      - idcard
      - bankcard
